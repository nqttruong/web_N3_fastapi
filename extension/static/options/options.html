<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cài đặt JLPT AI Review Extension</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Cài đặt JLPT AI Review Extension</h1>
      <p>Extension chỉ gửi capture tới địa chỉ loopback đã chọn. Token chỉ lưu trong Chrome trên máy này.</p>
      <form>
        <label for="api-url">Backend API base URL</label>
        <input id="api-url" type="url" required />
        <label for="web-url">Frontend base URL</label>
        <input id="web-url" type="url" required />
        <label for="extension-token">Token extension (tùy chọn)</label>
        <input id="extension-token" type="password" autocomplete="new-password" />
        <p id="token-state" class="hint"></p>
        <label for="dictionary-token">Credential Từ của tôi (riêng với token nhập đề)</label>
        <input id="dictionary-token" type="password" autocomplete="new-password" />
        <p id="dictionary-token-state" class="hint"></p>
        <div class="buttons">
          <button type="submit">Lưu cài đặt</button>
          <button id="clear-token" type="button" class="secondary">Xoá token</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="hint">Mặc định: <code>http://127.0.0.1:8000/api/v1</code> và <code>http://127.0.0.1:3000</code>.</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
